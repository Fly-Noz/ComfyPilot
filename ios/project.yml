# XcodeGen 工程描述。仓库里不提交 .xcodeproj——它由 `xcodegen generate` 现场生成，
# 避免二进制工程文件在多人/多分支下反复冲突。
#
# 本地（macOS）：
#   ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64
#   cd ios && xcodegen generate && open ComfyPilot.xcodeproj
#
# 真机需要把 KMP_FRAMEWORK_DIR 指到 iosArm64 的产物：
#   xcodebuild ... KMP_FRAMEWORK_DIR=$(pwd)/../shared/build/bin/iosArm64/debugFramework

name: ComfyPilot

options:
  minimumXcodeGenVersion: "2.38.0"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3.5"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # CI 与自签名分发都不走 Apple 的签名流程；真机签名交给 Sideloadly/AltStore。
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    # 默认指向模拟器产物；真机构建时用命令行覆盖。
    KMP_FRAMEWORK_DIR: $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework

targets:
  ComfyPilot:
    type: application
    platform: iOS
    sources:
      - path: ComfyPilot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fly.comfypilot
        PRODUCT_NAME: ComfyPilot
        INFOPLIST_FILE: ComfyPilot/Info.plist
        # 图标走资源目录：Assets.xcassets 里的 AppIcon（单尺寸 1024）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(KMP_FRAMEWORK_DIR)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - ComfyCore

# 显式声明 scheme：CI 用 xcodebuild -scheme，必须有共享 scheme，
# 不能指望「用 Xcode 打开时自动生成」。
schemes:
  ComfyPilot:
    build:
      targets:
        ComfyPilot: all
    run:
      config: Debug
    archive:
      config: Release
