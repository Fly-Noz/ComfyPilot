name: iOS

# 没有 Mac 时的开发回路：push 触发，macOS runner 编 framework + App，
# 在模拟器里跑起来截图，最后把截图和构建日志推到 ci-artifacts 分支。
# 本机 GitHub API / 网页都不通，所以刻意不用 gh 和 artifact API——
# 结果全部走 git（SSH 443 是通的），失败时也能从分支里读到日志。

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'tools/mock-comfyui/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # macos-15 是 Apple Silicon；Kotlin/Native 的 iosSimulatorArm64 只在 arm64 上能链接。
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 检查 runner 架构
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          arch=$(uname -m)
          echo "runner arch: $arch"
          if [ "$arch" != "arm64" ]; then
            echo "::error::需要 Apple Silicon runner，当前是 $arch"
            exit 1
          fi
          xcodebuild -version | tee "$RUNNER_TEMP/logs/00-env.log"

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 让 Gradle 找到 Android SDK
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi
          cat local.properties 2>/dev/null || echo "no local.properties"

      - name: 缓存 Gradle 与 Kotlin/Native 工具链
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 编译共享层 framework
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --no-daemon --stacktrace 2>&1 \
            | tee "$RUNNER_TEMP/logs/01-gradle.log"

      - name: 生成 Xcode 工程
        run: |
          set -o pipefail
          brew install xcodegen 2>&1 | tee "$RUNNER_TEMP/logs/02-xcodegen-install.log"
          cd ios
          xcodegen generate 2>&1 | tee "$RUNNER_TEMP/logs/03-xcodegen.log"
          ls -d ComfyPilot.xcodeproj

      - name: 选一台模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -E "^[[:space:]]+iPhone" | head -1 | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::找不到可用的 iPhone 模拟器"
            xcrun simctl list devices available
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "模拟器：$UDID"

      - name: 编译 App
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project ComfyPilot.xcodeproj \
            -scheme ComfyPilot \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_DEBUG_DYLIB=NO \
            build 2>&1 | tee "$RUNNER_TEMP/logs/04-xcodebuild.log"
          # ENABLE_DEBUG_DYLIB=NO：Xcode 16 默认把 Debug 产物拆成「瘦壳 + ComfyPilot.debug.dylib」，
          # 第三方模拟器平台（Appetize 等）对这种结构支持不稳，打成单二进制最省事。

      - name: 打包模拟器 App（Appetize 上传用）
        run: |
          APP="ios/build/Build/Products/Debug-iphonesimulator/ComfyPilot.app"
          if [ ! -d "$APP" ]; then
            echo "::error::没有找到 $APP"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/package"
          # --keepParent 保证 zip 里是 ComfyPilot.app/ 这一层，Appetize 要求这个结构
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/package/ComfyPilot-sim.zip"
          ls -lh "$RUNNER_TEMP/package"
          # 记一下架构，确认是 arm64 模拟器构建（Appetize 推荐）
          lipo -info "$APP/ComfyPilot"

      - name: 启动模拟器
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override \
            --time "9:41" --batteryState charged --batteryLevel 100 \
            --wifiBars 3 --cellularBars 4 || true

      - name: 安装 App
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP=$(find ios/build/Build/Products -maxdepth 3 -name "ComfyPilot.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::没找到 ComfyPilot.app"
            find ios/build/Build/Products -maxdepth 3 -name "*.app"
            exit 1
          fi
          echo "app: $APP"
          xcrun simctl install "$UDID" "$APP"

      - name: 起 mock ComfyUI
        run: |
          cd tools/mock-comfyui
          npm install --no-audit --no-fund
          nohup node server.mjs > "$RUNNER_TEMP/logs/05-mock.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8188/system_stats > /dev/null; then
              echo "mock 已就绪"
              exit 0
            fi
            sleep 1
          done
          echo "::error::mock 服务端没起来"
          cat "$RUNNER_TEMP/logs/05-mock.log"
          exit 1

      - name: 截图
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          mkdir -p shots

          # shoot <名字> <等待秒数> <启动参数...>
          shoot() {
            name="$1"; shift
            wait="$1"; shift
            xcrun simctl terminate "$UDID" com.fly.comfypilot > /dev/null 2>&1 || true
            sleep 1
            xcrun simctl launch "$UDID" com.fly.comfypilot "$@" > /dev/null
            sleep "$wait"
            xcrun simctl io "$UDID" screenshot "shots/$name.png" > /dev/null 2>&1
            echo "已截图：$name"
          }

          # 统一用深色出图：两端都是以深色为基准设计的，浅色只是可选主题
          shoot connect  8 -uiScreen connect  -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark
          shoot workflow 8 -uiScreen workflow -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark
          shoot tasks    8 -uiScreen tasks    -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark
          shoot settings 8 -uiScreen settings -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark

          # 关于页：独立页面（图标/简介/检查更新/项目地址/开源许可证），与安卓/鸿蒙对齐
          shoot about 8 -uiScreen about -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark

          # 打开真实工作流：要等目录、文档、节点定义依次就绪，给的时间长一点
          shoot workflow-detail 16 -uiScreen workflow -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark -uiOpenWorkflow demo_ui.json

          # 图片上传：打开工作流后把内置夹具图传到 LoadImage 的 image 字段，
          # 截图里该字段应该变成服务器返回的文件名（photo-xxxx.jpg）
          # 用 demo_upload.json（只有 LoadImage → SaveImage）：LoadImage 在列表第一位，
          # 截图才看得见 image 字段被换成服务器文件名
          shoot workflow-upload 14 -uiScreen workflow -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark -uiOpenWorkflow demo_upload.json -uiUploadImage

          # 自动提交一次后自动跳到任务页：验证 prompt 能被服务端接受、任务真的入列，
          # 同时看产物行的排版（已完成的任务带 1 个产物）
          shoot tasks-after-submit 20 -uiScreen workflow -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark -uiOpenWorkflow demo_ui.json -uiAutoSubmit

          # 结果预览：同一会话内提交并等完成（任务列表不跨重启保留），
          # autoSubmit 跳任务页后 -uiOpenArtifact 自动打开产物查看器（含保存按钮）
          shoot artifact 32 -uiScreen workflow -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark -uiOpenWorkflow demo_upload.json -uiAutoSubmit -uiOpenArtifact

          # 采样预览：先把 mock 切成 slow（每 10s 才推一次进度），
          # 这样自动提交后任务会一直停在执行中，够时间截到 ws.binary 解出来的画面。
          curl -sf -X POST http://127.0.0.1:8188/mock/scenario -H 'Content-Type: application/json' -d '{"scenario":"slow"}' > /dev/null
          shoot workflow-preview 42 -uiScreen workflow -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark -uiOpenWorkflow demo_ui.json -uiAutoSubmit -uiTab preview
          curl -sf -X POST http://127.0.0.1:8188/mock/scenario -H 'Content-Type: application/json' -d '{"scenario":"normal"}' > /dev/null

          # 节点图：加载完成后自动弹出只读节点图
          shoot workflow-graph 18 -uiScreen workflow -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark -uiOpenWorkflow demo_ui.json -uiGraph

          # 诊断页：把阶段/帧数/预览字节摊开，CI 点不了顶栏按钮，用启动参数直接弹
          shoot diagnostics 10 -uiScreen connect -uiBaseUrl http://127.0.0.1:8188 -uiTheme dark -uiDiagnostics

          # 浅色回归：只留一张，确认浅色主题没有崩
          shoot connect-light 8 -uiScreen connect -uiBaseUrl http://127.0.0.1:8188 -uiTheme light

          ls -lh shots

      - name: XCUITest 交互回归
        working-directory: ios
        run: |
          set -o pipefail
          # 截图只能验证「渲染成什么样」，点按/输入/弹层要靠 UI 测试：
          # 连接 → 打开工作流、提交任务、设置 → 关于页 → 许可证浮层 → 返回。
          # mock 在 8188 上已就绪（上一步），App 用 -uiBaseUrl 自动连接。
          xcodebuild test \
            -project ComfyPilot.xcodeproj \
            -scheme ComfyPilot \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            -only-testing:ComfyPilotUITests \
            2>&1 | tee "$RUNNER_TEMP/logs/07-uitest.log" | tail -120

      - name: 核对上传链路（mock 侧 lastUpload）
        run: |
          # 不再靠截图猜：直接问 mock 有没有真的收到 /upload/image。
          STATE=$(curl -s http://127.0.0.1:8188/mock/state)
          echo "mock state: $STATE"
          LAST=$(echo "$STATE" | jq -r '.lastUpload.name // empty')
          {
            echo "## 上传链路核对"
            echo ""
            echo '```json'
            echo "$STATE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$LAST" ]; then
            echo "::error::mock 没收到任何 /upload/image——app 的 -uiUploadImage 自动上传链路没跑通"
            exit 1
          fi
          echo "lastUpload = $LAST，上传链路 OK"

      - name: 检查 App 有没有崩
        run: |
          # 模拟器的崩溃报告落在宿主机的 DiagnosticReports 里。
          # 没有这一步，App 一启动就崩也只会得到几张桌面截图。
          if ls ~/Library/Logs/DiagnosticReports/ComfyPilot* > /dev/null 2>&1; then
            echo "::error::ComfyPilot 崩溃了"
            head -120 ~/Library/Logs/DiagnosticReports/ComfyPilot* \
              | tee "$RUNNER_TEMP/logs/06-crash.log" || true
            exit 1
          fi
          echo "无崩溃报告"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots
          if-no-files-found: warn

      - name: 发布截图与日志到 ci-artifacts 分支
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP"
          rm -rf art && mkdir art && cd art
          git init -q
          git checkout -q -b ci-artifacts

          if [ -d "$GITHUB_WORKSPACE/shots" ]; then
            cp "$GITHUB_WORKSPACE"/shots/*.png . 2>/dev/null || true
          fi

          # 模拟器包：给 Appetize 手动上传用（不进 Actions artifact，走 git 更方便取）
          if [ -d "$RUNNER_TEMP/package" ]; then
            cp "$RUNNER_TEMP"/package/*.zip . 2>/dev/null || true
          fi

          # 日志截断到末尾 2000 行，失败的真正原因通常在尾巴上。
          if [ -d "$RUNNER_TEMP/logs" ]; then
            for f in "$RUNNER_TEMP"/logs/*.log; do
              [ -e "$f" ] || continue
              tail -n 2000 "$f" > "$(basename "$f")"
            done
          fi

          {
            echo "# iOS 构建结果"
            echo
            echo "- 状态：**${{ job.status }}**"
            echo "- 运行：#${{ github.run_number }}"
            echo "- 提交：\`${{ github.sha }}\`"
            echo "- 时间：$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "取图或看日志："
            echo
            echo '```'
            echo "git fetch origin ci-artifacts"
            echo "git show origin/ci-artifacts:tasks.png > tasks.png"
            echo "git show origin/ci-artifacts:04-xcodebuild.log | tail -80"
            echo '```'
          } > README.md

          git add -A
          if git diff --cached --quiet; then
            echo "没有内容，跳过"
            exit 0
          fi
          git -c user.email="ci@comfypilot.local" -c user.name="ComfyPilot CI" \
            commit -qm "ci: iOS #${{ github.run_number }} (${{ job.status }})"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-artifacts
          echo "已推送 ci-artifacts"

      - name: 失败时导出模拟器日志
        if: failure()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          echo "--- Build Products ---"
          find ios/build/Build/Products -maxdepth 3 -name "*.app" 2>/dev/null || true
          echo "--- Simulator log ---"
          xcrun simctl spawn "$UDID" log show --last 10m \
            --predicate 'process == "ComfyPilot"' --style compact 2>/dev/null | tail -200 || true
