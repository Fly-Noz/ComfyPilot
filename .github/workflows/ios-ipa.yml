name: iOS Unsigned IPA

# 手动触发，或推 v* tag 时构建未签名 IPA。
# IPA 上传到 Actions artifact；tag 构建会同时附到对应 Release。

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 让 Gradle 找到 Android SDK
        run: |
          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          fi

      - name: 缓存 Gradle 与 Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-gradle-ipa-${{ hashFiles('gradle/libs.versions.toml', '**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ipa-
            ${{ runner.os }}-gradle-

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 打包未签名 IPA
        run: bash ios/package.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: ComfyPilot-unsigned-ipa
          path: ios/build/ComfyPilot-unsigned.ipa
          if-no-files-found: error

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ios/build/ComfyPilot-unsigned.ipa
          fail_on_unmatched_files: true
          # iOS 测试 tag（如 v0.3.5-ios）不要抢 /releases/latest。
          prerelease: ${{ contains(github.ref, '-ios') }}
